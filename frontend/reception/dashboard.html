<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reception · Medical Record System</title>
    <link rel="stylesheet" href="../shared/styles.css">
</head>
<body style="--dept-color: var(--dept-reception);">

    <div class="topbar">
        <div class="topbar-inner">
            <h1>Reception <span class="topbar-tag">Reception</span></h1>
            <div class="topbar-user">
                <span id="userLabel"></span>
                <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="page">
        <div class="grid-2">
            <div class="card">
                <h5>Register new patient</h5>
                <div id="errorBox" class="alert alert-error hidden"></div>
                <div id="successBox" class="alert alert-success hidden"></div>

                <form id="patientForm">
                    <div class="field">
                        <label>Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="field">
                        <label>Age</label>
                        <input type="number" id="age" min="0" max="120">
                    </div>
                    <div class="field">
                        <label>Gender</label>
                        <select id="gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Phone</label>
                        <input type="text" id="phone">
                    </div>
                    <div class="field">
                        <label>Address</label>
                        <input type="text" id="address">
                    </div>
                    <button type="submit" class="btn btn-block">Register &amp; generate QR</button>
                </form>
            </div>

            <div class="card">
                <h5>Patient QR code</h5>
                <div id="qrResult" class="qr-frame">
                    <p>Register a patient to generate their QR code.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/api.js"></script>
    <script>
        document.getElementById('userLabel').textContent =
            localStorage.getItem('username') + ' (' + localStorage.getItem('department') + ')';

        getToken();

        if (localStorage.getItem('department') !== 'Reception') {
            alert('Access denied: this page is for Reception only.');
            window.location.href = '/login.html';
        }

        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const ageValue = document.getElementById('age').value;
            if (ageValue !== '' && (Number(ageValue) < 0 || Number(ageValue) > 120)) {
                errorBox.textContent = 'Please enter a valid age between 0 and 120.';
                errorBox.classList.remove('hidden');
                return;
            }

            const patientData = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };

            try {
                const created = await apiRequest('/patients', 'POST', patientData);
                const newPatientId = created.patientId;

                successBox.textContent = `Patient registered successfully (ID: ${newPatientId})`;
                successBox.classList.remove('hidden');

                const qrData = await apiRequest(`/patients/${newPatientId}/qrcode`, 'GET');

                document.getElementById('qrResult').innerHTML = `
                    <p class="qr-name">${qrData.name} <span class="muted">(ID: ${qrData.patientId})</span></p>
                    <img src="${qrData.qrCode}" alt="Patient QR Code">
                `;

                document.getElementById('patientForm').reset();

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
