<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor · Medical Record System</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="--dept-color: var(--dept-doctor);">

    <div class="topbar">
        <div class="topbar-inner">
            <h1>Doctor <span class="topbar-tag">Doctor</span></h1>
            <div class="topbar-user">
                <span id="userLabel"></span>
                <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="page">

        <div class="card">
            <h5>Scan patient QR</h5>
            <button class="btn btn-secondary" id="startScanBtn" style="margin-bottom: 14px;">Start scanner</button>
            <div id="reader" style="width: 300px;"></div>
            <div id="scanStatus" class="muted" style="margin-top: 8px; font-size: 0.85rem;"></div>
        </div>

        <div id="patientSection" class="hidden">
            <div class="card">
                <h5>Patient: <span id="patientName"></span> <span class="muted">(ID: <span id="patientIdLabel"></span>)</span></h5>
            </div>

            <div class="grid-2">
                <div class="card">
                    <h6>Medical history</h6>
                    <div id="recordsList">
                        <p class="muted">No records yet.</p>
                    </div>
                </div>

                <div class="card">
                    <h6>Add diagnosis</h6>
                    <div id="errorBox" class="alert alert-error hidden"></div>
                    <div id="successBox" class="alert alert-success hidden"></div>
                    <form id="recordForm">
                        <div class="field">
                            <label>Diagnosis</label>
                            <input type="text" id="diagnosis" required>
                        </div>
                        <div class="field">
                            <label>Doctor notes</label>
                            <textarea id="doctorNotes"></textarea>
                        </div>
                        <button type="submit" class="btn btn-block">Save diagnosis</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/api.js"></script>
    <script>
        document.getElementById('userLabel').textContent =
            localStorage.getItem('username') + ' (' + localStorage.getItem('department') + ')';

        getToken();

        if (localStorage.getItem('department') !== 'Doctor') {
            alert('Access denied: this page is for Doctors only.');
            window.location.href = '/login.html';
        }

        let currentPatientId = null;
        let html5QrCode = null;

        document.getElementById('startScanBtn').addEventListener('click', () => {
            document.getElementById('scanStatus').textContent = 'Starting camera...';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                onScanSuccess
            ).catch(err => {
                document.getElementById('scanStatus').textContent = 'Camera error: ' + err;
            });
        });

        async function onScanSuccess(decodedText) {
            let patientId;
            try {
                patientId = JSON.parse(decodedText).patientId;
            } catch (e) {
                document.getElementById('scanStatus').textContent = 'Invalid QR code scanned.';
                return;
            }

            html5QrCode.stop();
            document.getElementById('scanStatus').textContent = 'Scanned patient ID: ' + patientId;

            currentPatientId = patientId;
            await loadPatientData(patientId);
        }

        async function loadPatientData(patientId) {
            try {
                const patient = await apiRequest(`/patients/${patientId}`, 'GET');
                document.getElementById('patientName').textContent = patient.name;
                document.getElementById('patientIdLabel').textContent = patient.id;
                document.getElementById('patientSection').classList.remove('hidden');

                await loadRecords(patientId);
            } catch (err) {
                alert('Error loading patient: ' + err.message);
            }
        }

        async function loadRecords(patientId) {
    try {
        const records = await apiRequest(`/medical-records/patient/${patientId}`, 'GET');
        const listDiv = document.getElementById('recordsList');

        if (records.length === 0) {
            listDiv.innerHTML = '<p class="muted">No records yet.</p>';
            return;
        }

        let html = '';
        for (const r of records) {
            html += `
                <div class="record-item">
                    <strong>${r.diagnosis}</strong><br>
                    <span class="muted" style="font-size: 0.85rem;">${r.doctor_notes || ''}</span><br>
                    <span class="muted" style="font-size: 0.8rem;">${new Date(r.created_at).toLocaleDateString()}</span>

                    <div id="prescriptions-${r.id}" style="margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--rule);">
                        <p class="muted" style="font-size: 0.8rem;">Loading prescriptions...</p>
                    </div>

                    <div style="margin-top: 6px;">
                        <button class="btn btn-sm btn-secondary" onclick="togglePrescriptionForm(${r.id})">+ Add prescription</button>
                    </div>
                    <div id="rx-form-${r.id}" class="hidden" style="margin-top: 8px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 2px;">
                        <div class="field">
                            <label>Medicine name</label>
                            <input type="text" id="rx-medicine-${r.id}">
                        </div>
                        <div class="field">
                            <label>Dosage</label>
                            <input type="text" id="rx-dosage-${r.id}" placeholder="e.g. 500mg twice daily">
                        </div>
                        <div class="field">
                            <label>Duration</label>
                            <input type="text" id="rx-duration-${r.id}" placeholder="e.g. 5 days">
                        </div>
                        <div id="rx-error-${r.id}" class="alert alert-error hidden"></div>
                        <button class="btn btn-sm" onclick="submitPrescription(${r.id})">Save prescription</button>
                    </div>
                </div>
            `;
        }
        listDiv.innerHTML = html;

        // Load prescriptions for each record after the HTML is in place
        for (const r of records) {
            loadPrescriptionsForRecord(r.id);
        }
    } catch (err) {
        console.error(err);
    }
}

async function loadPrescriptionsForRecord(recordId) {
    const container = document.getElementById('prescriptions-' + recordId);
    try {
        const prescriptions = await apiRequest(`/prescriptions/record/${recordId}`, 'GET');

        if (prescriptions.length === 0) {
            container.innerHTML = '<p class="muted" style="font-size: 0.8rem;">No prescriptions for this record.</p>';
            return;
        }

        container.innerHTML = prescriptions.map(p => `
            <p style="font-size: 0.85rem; margin: 4px 0;">
                💊 ${p.medicine_name} — ${p.dosage || 'N/A'}, ${p.duration || 'N/A'}
            </p>
        `).join('');
    } catch (err) {
        container.innerHTML = '<p class="muted" style="font-size: 0.8rem;">Could not load prescriptions.</p>';
    }
}

function togglePrescriptionForm(recordId) {
    document.getElementById('rx-form-' + recordId).classList.toggle('hidden');
}

async function submitPrescription(recordId) {
    const medicine = document.getElementById(`rx-medicine-${recordId}`).value;
    const dosage = document.getElementById(`rx-dosage-${recordId}`).value;
    const duration = document.getElementById(`rx-duration-${recordId}`).value;
    const errorBox = document.getElementById(`rx-error-${recordId}`);

    errorBox.classList.add('hidden');

    if (!medicine) {
        errorBox.textContent = 'Medicine name is required';
        errorBox.classList.remove('hidden');
        return;
    }

    try {
        await apiRequest('/prescriptions', 'POST', {
            medical_record_id: recordId,
            medicine_name: medicine,
            dosage: dosage,
            duration: duration
        });

        document.getElementById(`rx-medicine-${recordId}`).value = '';
        document.getElementById(`rx-dosage-${recordId}`).value = '';
        document.getElementById(`rx-duration-${recordId}`).value = '';
        document.getElementById('rx-form-' + recordId).classList.add('hidden');

        await loadPrescriptionsForRecord(recordId);

    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
    }
}

        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            try {
                await apiRequest('/medical-records', 'POST', {
                    patient_id: currentPatientId,
                    diagnosis: document.getElementById('diagnosis').value,
                    doctor_notes: document.getElementById('doctorNotes').value
                });

                successBox.textContent = 'Diagnosis saved successfully!';
                successBox.classList.remove('hidden');
                document.getElementById('recordForm').reset();

                await loadRecords(currentPatientId);

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
