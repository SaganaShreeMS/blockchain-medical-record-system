<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy · Medical Record System</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="--dept-color: var(--dept-pharmacy);">

    <div class="topbar">
        <div class="topbar-inner">
            <h1>Pharmacy <span class="topbar-tag">Pharmacy</span></h1>
            <div class="topbar-user">
                <span id="userLabel"></span>
                <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="page">

        <div class="card">
            <h5>Scan patient QR</h5>
            <button class="btn btn-secondary" id="startScanBtn" style="margin-bottom: 14px;">Start scanner</button>
            <div id="reader" style="width: 300px;"></div>
            <div id="scanStatus" class="muted" style="margin-top: 8px; font-size: 0.85rem;"></div>
        </div>

        <div id="patientSection" class="hidden">
            <div class="card">
                <h5>Patient: <span id="patientName"></span> <span class="muted">(ID: <span id="patientIdLabel"></span>)</span></h5>
            </div>

            <div class="card">
                <h6>Medical records &amp; prescriptions</h6>
                <div id="recordsList">
                    <p class="muted">No records found.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/api.js"></script>
    <script>
        document.getElementById('userLabel').textContent =
            localStorage.getItem('username') + ' (' + localStorage.getItem('department') + ')';

        getToken();

        if (localStorage.getItem('department') !== 'Pharmacy') {
            alert('Access denied: this page is for Pharmacy staff only.');
            window.location.href = '/login.html';
        }

        let html5QrCode = null;

        document.getElementById('startScanBtn').addEventListener('click', () => {
            document.getElementById('scanStatus').textContent = 'Starting camera...';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                onScanSuccess
            ).catch(err => {
                document.getElementById('scanStatus').textContent = 'Camera error: ' + err;
            });
        });

        async function onScanSuccess(decodedText) {
            let patientId;
            try {
                patientId = JSON.parse(decodedText).patientId;
            } catch (e) {
                document.getElementById('scanStatus').textContent = 'Invalid QR code scanned.';
                return;
            }

            html5QrCode.stop();
            document.getElementById('scanStatus').textContent = 'Scanned patient ID: ' + patientId;

            await loadPatientData(patientId);
        }

        async function loadPatientData(patientId) {
            try {
                const patient = await apiRequest(`/patients/${patientId}`, 'GET');
                document.getElementById('patientName').textContent = patient.name;
                document.getElementById('patientIdLabel').textContent = patient.id;
                document.getElementById('patientSection').classList.remove('hidden');

                await loadPrescriptions(patientId);
            } catch (err) {
                alert('Error loading patient: ' + err.message);
            }
        }

        async function loadPrescriptions(patientId) {
            const listDiv = document.getElementById('recordsList');

            try {
                const records = await apiRequest(`/medical-records/patient/${patientId}`, 'GET');

                if (records.length === 0) {
                    listDiv.innerHTML = '<p class="muted">No medical records found for this patient.</p>';
                    return;
                }

                let html = '';

                for (const record of records) {
                    const prescriptions = await apiRequest(`/prescriptions/record/${record.id}`, 'GET');

                    html += `<div class="record-item">
                        <strong>Diagnosis:</strong> ${record.diagnosis}
                        <span class="muted" style="font-size: 0.8rem;">(${new Date(record.created_at).toLocaleDateString()})</span>`;

                    if (prescriptions.length === 0) {
                        html += `<p class="muted" style="margin: 6px 0 0 12px;">No prescriptions for this record.</p>`;
                    } else {
                        html += '<ul style="margin: 6px 0 0;">';
                        prescriptions.forEach(p => {
                            html += `<li>${p.medicine_name} — ${p.dosage || 'N/A'}, ${p.duration || 'N/A'}</li>`;
                        });
                        html += '</ul>';
                    }

                    html += `</div>`;
                }

                listDiv.innerHTML = html;

            } catch (err) {
                listDiv.innerHTML = `<p style="color: var(--error);">Error: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
