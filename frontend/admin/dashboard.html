<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
        <div>
            <span class="text-white me-3" id="userLabel"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card p-4 shadow-sm mb-4">
            <h5>Look Up Patient</h5>
            <div class="input-group mb-3" style="max-width: 400px;">
                <input type="number" class="form-control" id="patientIdInput" placeholder="Enter Patient ID">
                <button class="btn btn-primary" id="lookupBtn">Search</button>
            </div>
            <div id="errorBox" class="alert alert-danger d-none"></div>

            <div id="patientDetails" class="d-none">
                <h6>Patient: <span id="patientName"></span> (ID: <span id="patientIdLabel"></span>)</h6>
                <p><strong>Age:</strong> <span id="patientAge"></span> | <strong>Gender:</strong> <span id="patientGender"></span> | <strong>Phone:</strong> <span id="patientPhone"></span></p>
                <p><strong>Address:</strong> <span id="patientAddress"></span></p>

                <h6 class="mt-3">Medical Records</h6>
                <div id="recordsList"><p class="text-muted">Loading...</p></div>
            </div>
        </div>

        <div class="card p-4 shadow-sm">
            <h5>Blockchain Audit Log</h5>
            <p class="text-muted">Coming soon — this section will display the tamper-evident record of every patient data access/modification, once the blockchain audit layer is built (Phase 9).</p>
        </div>

    </div>

    <script src="../shared/api.js"></script>
    <script>
        document.getElementById('userLabel').textContent =
            localStorage.getItem('username') + ' (' + localStorage.getItem('department') + ')';

        getToken();

        if (localStorage.getItem('department') !== 'Admin') {
            alert('Access denied: this page is for Admin only.');
            window.location.href = '/login.html';
        }

        document.getElementById('lookupBtn').addEventListener('click', async () => {
            const patientId = document.getElementById('patientIdInput').value;
            const errorBox = document.getElementById('errorBox');
            const detailsDiv = document.getElementById('patientDetails');

            errorBox.classList.add('d-none');
            detailsDiv.classList.add('d-none');

            if (!patientId) {
                errorBox.textContent = 'Please enter a patient ID';
                errorBox.classList.remove('d-none');
                return;
            }

            try {
                const patient = await apiRequest(`/patients/${patientId}`, 'GET');

                document.getElementById('patientName').textContent = patient.name;
                document.getElementById('patientIdLabel').textContent = patient.id;
                document.getElementById('patientAge').textContent = patient.age || 'N/A';
                document.getElementById('patientGender').textContent = patient.gender || 'N/A';
                document.getElementById('patientPhone').textContent = patient.phone || 'N/A';
                document.getElementById('patientAddress').textContent = patient.address || 'N/A';

                detailsDiv.classList.remove('d-none');

                // Load their medical records too, since Admin has full visibility
                const records = await apiRequest(`/medical-records/patient/${patientId}`, 'GET');
                const listDiv = document.getElementById('recordsList');

                if (records.length === 0) {
                    listDiv.innerHTML = '<p class="text-muted">No medical records.</p>';
                } else {
                    listDiv.innerHTML = records.map(r => `
                        <div class="border-bottom mb-2 pb-2">
                            <strong>${r.diagnosis}</strong><br>
                            <small class="text-muted">${r.doctor_notes || ''}</small><br>
                            <small class="text-muted">${new Date(r.created_at).toLocaleDateString()}</small>
                        </div>
                    `).join('');
                }

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
